# CR-DAgger default parameters

# These are overridden by CLI arguments where applicable

admittance:
  # Joint-space admittance dynamics: M·q̈_c = τ_ext - D·dq_c - K·(q_c - q_ref)
  mass: 1.0           # Virtual inertia [kg·m²] (scalar, applied per joint)
  damping: 5.0        # Virtual damping [Nm·s/rad]
  stiffness: 20.0     # Virtual stiffness [Nm/rad]

wrench_feedback:
  enable: false
  gain: 0.5           # Scaling factor for UR5e wrench → GELLO admittance

intervention:
  # Torque threshold detector (Schmitt trigger)
  torque_threshold_high: 0.3    # Nm — activation
  torque_threshold_low: 0.15    # Nm — deactivation
  torque_onset_steps: 3
  torque_offset_steps: 10

  # Delta position detector
  delta_q_threshold: 0.02       # rad
  delta_dq_threshold: 0.05      # rad/s
  delta_onset_s: 0.03
  delta_offset_s: 0.2

  # Energy injection detector
  energy_threshold: 0.005       # Joules
  energy_decay_rate: 10.0       # 1/s

  # Fusion
  min_votes: 2                  # Minimum detector agreements

shi_observer:
  alpha_ema: 0.5
  vel_threshold: 0.05
  eta: 0.65

recording:
  latency_compensation_s: 0.008   # Dynamixel position mode latency
  log_dir: "cr_dagger_data"

policy:
  action_dt: 0.1                  # Seconds between waypoints
  horizon: 32                     # Number of waypoints per prediction

ipc:
  trajectory_shm_name: "cr_dagger_traj"
  observation_shm_name: "cr_dagger_obs"
  obs_write_decimation: 33        # Write obs every N control steps (~10 Hz)

lerobot:
  default_fps: 330                        # Control loop frequency
  camera_fps: 30                          # Camera frame rate
  video_codec: "av1"                      # MP4 codec
  default_camera_shape: [480, 640, 3]     # H, W, C
  enable_push_to_hub: false
  private: true

  # Feature names (for documentation — actual schema is in lerobot_recorder.py)
  # observation.state:      [q(6), dq(6), gripper(1)]      = 13 dims
  # observation.effort:     tau_ext(6)                      = 6 dims
  # observation.wrench:     wrench(6)                       = 6 dims
  # observation.delta_q:    q_c - q_ref (latency-comp.)    = 6 dims
  # action:                 q_ref(6) + gripper_ref(1)       = 7 dims
  # action.compliant:       q_c(6) + gripper_c(1)           = 7 dims


phase_b:
  # Validated Phase-B architecture (2026-05-26): BOTA SE(3) admittance
  # generates bounded joint residuals; the UR5e command is q_ref_policy + delta_human.
  mode: "bota_se3_residual"

  follower:
    # UR5e direct-torque impedance gains used during the final pre-collection tests.
    kp: 190.0
    kd: 15.0
    # Ramp from the measured UR5e pose to q_ref before recording to avoid torque steps at arming.
    handoff_ramp_s: 0.60

  leader_position:
    # Position mode avoids using high-friction Dynamixel currents as the correction signal.
    operating_mode: 3
    handoff_settle_s: 0.50       # Unrecorded settle after torque is enabled in position mode.
    recover_pre_handoff: true    # Recover synthetic handoff sag before arming collection.
    recover_s: 0.80
    recover_max_delta: 0.35      # Safety guard: skip recovery if any wrapped joint delta is larger.
    arm_settle_s: 0.50           # Unrecorded settle after follower command thread starts.
    current_limit: [910, 1193, 1193, 910, 910, 910, 910]
    goal_current: [910, 1193, 1193, 910, 910, 910, 910]
    position_p_gains: [1200, 800, 800, 1200, 1200, 1200, 1200]
    position_i_gains: [0, 0, 0, 0, 0, 0, 0]
    position_d_gains: [0, 0, 0, 0, 0, 300, 0]
    velocity_p_gains: [50, 100, 100, 50, 50, 50, 50]
    velocity_i_gains: [1800, 1920, 1920, 1800, 1800, 1800, 1800]

  bota:
    config: "configs/bota_binary.json"
    driver_tare: false
    warmup_s: 1.0
    bias_s: 2.0
    filter_cutoff_hz: 25.0
    filter_alpha: 0.0
    deadband: [0.25, 0.25, 0.25, 0.01, 0.01, 0.01]
    saturation: [25.0, 25.0, 25.0, 1.5, 1.5, 1.5]
    gravity_comp: false
    payload_mass_kg: 0.070
    payload_com_sensor_m: [0.0, 0.0, 0.0146]
    gravity_sign: 1.0
    # Correction applied after the nominal sensor-to-base rotation. 
    # Current test candidate swaps X and Z axes (0=X, 1=Y, 2=Z, 3=Rx, 4=Ry, 5=Rz).
    # Thus [2, 1, 0, 5, 4, 3] maps: X->Z, Y->Y, Z->X, Rx->Rz, Ry->Ry, Rz->Rx.
    base_axis_map: [2, 1, 0, 5, 4, 3]
    base_axis_signs: [-1, 1, 1, -1, 1, 1]
    frame: ""                    # Empty means the final Pinocchio frame from the leader URDF.
    output_mode: "offset"         # Validated mode: no-force SE(3) offset decays toward zero.
    axis_mask: [1, 1, 1, 0, 0, 0]
    cart_mass: [2.0, 2.0, 2.0, 0.5, 0.5, 0.5]
    cart_damp: [18.0, 18.0, 18.0, 5.0, 5.0, 5.0]
    cart_stiff: [8.0, 8.0, 8.0, 10.0, 10.0, 10.0]
    cart_max: [0.03, 0.03, 0.03, 0.025, 0.025, 0.025]
    dls_damping: 0.10
    stiction: [0, 0, 0, 0, 0, 0]
    wrench_sign: 1.0
    contact_force_scale: 8.0
    contact_torque_scale: 0.35

  residual:
    # Slew limits keep correction labels smooth and reduce follower acceleration spikes.
    delta_max: 0.06
    delta_rate_max: [0.16, 0.22, 0.22, 0.28, 0.28, 0.28]
    delta_release_rate_max: [0.12, 0.18, 0.18, 0.22, 0.22, 0.22]
    delta_release_tau_s: 0.35
    delta_release_contact_threshold: 0.05

  intervention:
    # Logged intervention flag: source bit 1 = BOTA contact, bit 2 = residual delta.
    contact_threshold: 0.25
    delta_threshold: 0.01
