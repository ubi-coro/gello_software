# Example configuration snippet for enabling data logging
# Add this to your YAML config file (e.g., yam_gello_factr_hw.yaml)

logging:
  enable: true  # Enable high-frequency data logging
  log_dir: "logs"  # Directory to save CSV files (relative to project root)
  
# Note: You can also enable logging via CLI:
#   python gello/factr/gravity_compensation.py -c your_config.yaml --log
#
# The logger will create timestamped files like:
#   logs/gello_data_20260122_143052.csv
#
# Data is buffered (1000 samples) and written in batches to minimize I/O overhead.
